name: Deploy to VPS

# Pushes to main SSH into the VPS and run scripts/deploy.sh.
# That script applies any new SQL files in migrations/ then rebuilds.
#
# Repository secrets:
#   VPS_HOST      server hostname
#   VPS_USER      ssh user
#   VPS_SSH_KEY   private key
#   VPS_PORT      optional, default 22
#   VPS_APP_DIR   optional, default /var/www/vela

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}"
            bash scripts/deploy.sh
